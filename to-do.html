<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Extreme To-Do Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
}

.app{
  width:400px;
  backdrop-filter:blur(15px);
  background:rgba(255,255,255,0.08);
  padding:20px;
  border-radius:20px;
  box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

h2{text-align:center;margin-bottom:10px;}

.input-group{
  display:flex;
  gap:5px;
  margin-bottom:10px;
}

input, select{
  padding:8px;
  border:none;
  border-radius:8px;
  outline:none;
}

button{
  padding:8px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#38bdf8;
  font-weight:bold;
}

.task{
  background:rgba(255,255,255,0.1);
  padding:10px;
  border-radius:10px;
  margin-top:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.task.completed span{
  text-decoration:line-through;
  opacity:0.6;
}

.high{border-left:4px solid red;}
.medium{border-left:4px solid orange;}
.low{border-left:4px solid green;}

.controls{
  display:flex;
  gap:5px;
}

.small-btn{
  padding:5px;
  font-size:12px;
}

.filters{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

.overdue{color:red;font-size:12px;}
</style>
</head>

<body>

<div class="app">
  <h2>Task Manager</h2>

  <div class="input-group">
    <input id="taskInput" placeholder="New task">
    <select id="priority">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
  </div>

  <div class="input-group">
    <input type="date" id="date">
    <button onclick="addTask()">Add</button>
  </div>

  <input id="search" placeholder="Search..." oninput="render()">

  <div class="filters">
    <button onclick="filter='all';render()">All</button>
    <button onclick="filter='active';render()">Active</button>
    <button onclick="filter='completed';render()">Done</button>
  </div>

  <div id="tasks"></div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let filter = "all";

function save(){
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function addTask(){
  const text = document.getElementById("taskInput").value;
  const priority = document.getElementById("priority").value;
  const date = document.getElementById("date").value;

  if(!text) return;

  tasks.push({
    id:Date.now(),
    text,
    priority,
    date,
    completed:false
  });

  document.getElementById("taskInput").value="";
  save();
  render();
}

function toggle(id){
  tasks = tasks.map(t=> t.id===id ? {...t,completed:!t.completed} : t);
  save(); render();
}

function remove(id){
  tasks = tasks.filter(t=>t.id!==id);
  save(); render();
}

function edit(id){
  const newText = prompt("Edit task:");
  if(newText){
    tasks = tasks.map(t=> t.id===id ? {...t,text:newText} : t);
    save(); render();
  }
}

function render(){
  const list = document.getElementById("tasks");
  const search = document.getElementById("search").value.toLowerCase();

  list.innerHTML="";

  tasks
    .filter(t => t.text.toLowerCase().includes(search))
    .filter(t => filter==="all" || (filter==="active" && !t.completed) || (filter==="completed" && t.completed))
    .forEach(t=>{
      const overdue = t.date && new Date(t.date) < new Date() && !t.completed;

      list.innerHTML += `
        <div class="task ${t.completed?'completed':''} ${t.priority}">
          <span onclick="toggle(${t.id})">${t.text}</span>
          <div>
            ${t.date ? `<div class="${overdue?'overdue':''}">${t.date}</div>`:''}
            <div class="controls">
              <button class="small-btn" onclick="edit(${t.id})">✏️</button>
              <button class="small-btn" onclick="remove(${t.id})">❌</button>
            </div>
          </div>
        </div>
      `;
    });
}

render();
</script>

</body>
</html>
